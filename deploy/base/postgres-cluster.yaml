apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: cartograph-db
spec:
  postgresVersion: 16
  image: quay.io/redhat-et/crunchy-postgres-age:16-1.6.0

  instances:
    - name: primary
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          memory: 512Mi
      dataVolumeClaimSpec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi

  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          shared_preload_libraries: age
          search_path: '"$user", public, ag_catalog'

  backups:
    pgbackrest:
      configuration:
        - secret:
            name: pgbackrest-s3-credentials
      global:
        repo1-path: /pgbackrest/cartograph
        repo1-s3-uri-style: path
        repo1-storage-verify-tls: "n"
      repos:
        - name: repo1
          s3:
            bucket: pgbackrest
            endpoint: minio.cartograph-minio.svc:9000
            region: us-east-1
          schedules:
            full: "0 2 * * *"
            incremental: "0 */6 * * *"
          volume:
            volumeClaimSpec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 5Gi
