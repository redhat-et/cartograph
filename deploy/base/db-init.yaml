apiVersion: v1
kind: ConfigMap
metadata:
  name: cartograph-db-init
data:
  init.sql: |
    \c cartograph

    CREATE EXTENSION IF NOT EXISTS age;

    SET search_path TO ag_catalog, public;
    DO $$ BEGIN
        PERFORM create_graph('ecosystem');
    EXCEPTION WHEN OTHERS THEN
        NULL;
    END $$;

    GRANT CREATE ON SCHEMA public TO cartograph;
    GRANT USAGE ON SCHEMA ag_catalog TO cartograph;
    GRANT ALL ON SCHEMA ecosystem TO cartograph;

    -- Transfer ownership of all ecosystem objects so AGE internal checks pass
    DO $xfer$ DECLARE r RECORD; BEGIN
        FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'ecosystem' LOOP
            EXECUTE 'ALTER TABLE ecosystem.' || quote_ident(r.tablename) || ' OWNER TO cartograph';
        END LOOP;
        FOR r IN SELECT sequence_name FROM information_schema.sequences WHERE sequence_schema = 'ecosystem' LOOP
            EXECUTE 'ALTER SEQUENCE ecosystem.' || quote_ident(r.sequence_name) || ' OWNER TO cartograph';
        END LOOP;
    END $xfer$;

    ALTER DEFAULT PRIVILEGES IN SCHEMA ecosystem GRANT ALL ON TABLES TO cartograph;
    ALTER DEFAULT PRIVILEGES IN SCHEMA ecosystem GRANT ALL ON SEQUENCES TO cartograph;
